<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1Tap Earn - Premium Mini App</title>
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="homePage" class="page active">
        <div class="header">
            <div>🔥 Streak: <span id="streakDays">0</span> Days</div>
            <div>📺 Today's Ads: <span id="adCount">0 / 30</span></div>
        </div>
        <div class="score-container">
            <div class="score-value" id="taps">0 / 50</div>
            <div class="score-title">TAPS UNTIL NEXT AD</div>
        </div>
        <div class="game-area">
            <button class="circle-btn" id="tapBtn" onclick="handleTap()">T</button>
        </div>
        <div class="progress-section">
            <div class="progress-container"><div class="progress-bar" id="energyBar"></div></div>
            <div class="energy-text">⚡ <span id="energyValue">1000</span> / 1000</div>
            <button class="streak-btn" id="streakBtn" onclick="claimDailyReward()">🎁 Claim Daily Reward</button>
        </div>
    </div>
    <div id="tasksPage" class="page">
        <div class="tasks-container">
            <h3>🚀 Official Social Tasks</h3>
            <div class="task-row"><span>📸 Follow Instagram (+25 Taps)</span><button class="task-btn" onclick="openSocial('instagram')">Follow</button></div>
            <div class="task-row"><span>📺 Subscribe YouTube (+25 Taps)</span><button class="task-btn" onclick="openSocial('youtube')">Join</button></div>
            <div class="task-row"><span>📢 Join Telegram Channel (+25 Taps)</span><button class="task-btn" onclick="openSocial('telegram')">Join</button></div>
        </div>
    </div>
    <div class="nav-bar">
        <button class="nav-item active" id="homeTab" onclick="switchPage('home')"><span>🏠</span><br>Home</button>
        <button class="nav-item" id="tasksTab" onclick="switchPage('tasks')"><span>🚀</span><br>Tasks</button>
    </div>
    <script src="./script.js"></script>
</body>
</html>
